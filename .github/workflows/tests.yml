name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["frontend/data/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The unit tests cover the pipeline logic only, so they need neither torch nor an API key.
      - run: pip install requests pytest
      - run: python -m pytest -q tests
